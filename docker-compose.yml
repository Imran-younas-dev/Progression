services:
  mysql:
    image: mysql:9
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: progression
      MYSQL_DATABASE: progression
      MYSQL_USER: progression
      MYSQL_PASSWORD: progression
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql_data:/var/lib/mysql

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"

volumes:
  mysql_data:
